      - "an_vat"
    substitute_categories:
      - "che"
      - "kem"
      - "ca_vien_chien"
      - "ga_ran"
      - "tra_sua"
    alias:
      banh_trang_tron: ["bánh tráng trộn", "bánh tráng"]
      ga_ran: ["gà rán", "gà chiên"]

  - jtbd_group: "gathering_dinner"
    mo_ta: "Tụ tập / bữa tối — nhóm đông, chi tiêu theo đầu người"
    nhom_lam_tron: "mon_chinh"
    version: 1
    core_categories:
      - "lau"
    substitute_categories:
      - "bbq_nuong"
      - "quan_oc"
      - "quan_nhau"
      - "mon_viet"
    alias:
      lau: ["lẩu", "lau", "lẩu thái", "lẩu bò"]
      bbq_nuong: ["nướng", "bbq", "thịt nướng"]

# ── Nhóm chờ chủ dự án duyệt — plan mục 3.4 gợi ý nhưng chưa có trong ma trận 1.2 ──
# BUSINESS_DECISION_PENDING_REVIEW: xem plan mục 3.4. Hai nhóm dưới đây là VÍ DỤ
# plan nêu ra ("Ăn chay", "Ăn kiêng low-carb"), chưa có dữ liệu thị trường kiểm chứng.
entries_cho_duyet:
  - jtbd_group: "vegetarian_meal"
    mo_ta: "Ăn chay — chưa có trong ma trận plan mục 1.2, chờ duyệt"
    nhom_lam_tron: "mon_chinh"
    version: 1
    core_categories:
      - "com_chay"
      - "bun_chay"
    substitute_categories:
      - "pho_chay"
      - "lau_chay"

  - jtbd_group: "low_carb_meal"
    mo_ta: "Ăn kiêng low-carb — chưa có trong ma trận plan mục 1.2, chờ duyệt"
    nhom_lam_tron: "mon_chinh"
    version: 1
    core_categories:
      - "salad"
      - "eat_clean"
    substitute_categories:
      - "gym_meal"
      - "smoothie_bowl"

ghi_chu: |
  Thêm nhóm nhu cầu mới = thêm một entry vào `entries` và bump `version` của entry đó.
  KHÔNG sửa mã trong ag_pricing. Loader sẽ từ chối file thiếu trường bắt buộc
  (jtbd_group / core_categories / substitute_categories / version) thay vì âm thầm bỏ qua.
  `entries_cho_duyet` KHÔNG được loader nạp vào taxonomy hoạt động.
