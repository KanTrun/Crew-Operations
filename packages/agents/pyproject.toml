[project]
name = "ca-agents"
version = "0.1.0"
requires-python = ">=3.12"
# numpy: Math Layer AG-PRICING dùng numpy.percentile(method="linear") — plan
# 260913-1455 mục 4.1 yêu cầu MỘT phương pháp phân vị duy nhất, không tự viết tay.
# pyyaml: pricing_config / substitute_taxonomy nạp tham số từ config/*.yaml
# (plan mục 1.5 và 3.4 — không hard-code số nghiệp vụ trong mã).
# ca-contracts KHÔNG khai báo ở đây theo convention sẵn có của repo: package
# được cài riêng (`make setup` / Dockerfile.api cài ./packages/contracts trước).
dependencies = [
    "numpy>=2.0",
    "pyyaml>=6.0",
    "websockets>=15.0",
    # imageio-ffmpeg: decode audio (webm/opus, mp3, ogg, wav) sang PCM16 16kHz
    # cho STT Live (gemini-3.5-transcribe-live). Cung cấp ffmpeg binary qua pip.
    "imageio-ffmpeg>=0.5",
    # AG-GMAIL (quản lý Gmail): OAuth 2.0 + gọi Gmail API.
    # httpx: gọi endpoint thu hồi token của Google (oauth.revoke_token).
    "google-api-python-client>=2.100.0",
    "google-auth>=2.25.0",
    "google-auth-oauthlib>=1.1.0",
    "httpx>=0.27.0",
    # pillow + scipy: ca_agents.bg_redesign tách chủ thể ly nước khỏi nền
    # (flood-fill màu + connected component qua scipy.ndimage) rồi composite
    # lại bằng Pillow — giữ 100% pixel ly nước gốc, AI chỉ vẽ nền mới.
    # Module này phục vụ chế độ "Giữ nguyên ly nước" (keep_drink) và
    # `scripts/_diag_*` của quán để soi chất lượng tách chủ thể.
    "pillow>=10.0",
    "scipy>=1.11",
]

[project.optional-dependencies]
# hypothesis: property-based test cho 4 bất biến plan mục 4.6.
dev = ["hypothesis>=6.100"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ca_agents"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""
