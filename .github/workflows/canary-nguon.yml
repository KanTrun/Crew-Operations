# Canary hàng ngày cho nguồn cào bên thứ ba — plan `260913-1455` mục 7 [ĐỀ XUẤT MỚI].
#
# TÁCH BIỆT KHỎI `ci.yml` một cách cố ý, và `continue-on-error: true` ở mọi bước:
# plan yêu cầu "test canary hàng ngày chạy riêng (không nằm trong CI chặn merge) để
# cảnh báo sớm khi ShopeeFood/Google Maps đổi UI, tách biệt khỏi test suite chính để
# không block release vì lỗi bên ngoài".
#
# Một workflow canary ĐỎ không được phép chặn deploy. Giá trị của nó nằm ở chỗ ghi
# lại bằng chứng theo thời gian để người vận hành thấy nguồn bắt đầu hỏng từ hôm nào.
name: canary-nguon

on:
  schedule:
    # 02:00 UTC mỗi ngày = 09:00 giờ VN, khung giờ quán mở cửa nên trang có dữ liệu thật.
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      json:
        description: "In kết quả dạng JSON thay vì báo cáo"
        type: boolean
        default: false

concurrency:
  group: canary-nguon
  cancel-in-progress: false

jobs:
  canary:
    name: "canary nguồn cào (không chặn merge)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cài camoufox + trình duyệt
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          python -m pip install camoufox[geoip]
          python -m camoufox fetch

      # headless=False trong script cần display ảo; thiếu nó canary sẽ báo
      # "khong_chay_duoc" chứ không báo oan là nguồn chết.
      - name: Cài display ảo
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Chạy canary
        continue-on-error: true
        run: |
          xvfb-run -a python scripts/canary/chay_canary_nguon.py \
            ${{ inputs.json && '--json' || '' }} | tee canary-nguon.txt

      - name: Lưu bằng chứng
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: canary-nguon-${{ github.run_id }}
          path: canary-nguon.txt
          if-no-files-found: ignore
          retention-days: 30

      - name: Tóm tắt ra Summary
        if: always()
        continue-on-error: true
        run: |
          {
            echo "## Canary nguồn cào bên thứ ba"
            echo ""
            echo "Canary **không chặn merge**. Mức \`[NGUON HONG]\` nghĩa là nên giảm"
            echo "tần suất crawl và cập nhật selector ở"
            echo "\`packages/agents/src/ca_agents/sources/scraper_selectors.py\`."
            echo ""
            echo '```'
            cat canary-nguon.txt 2>/dev/null || echo "(không có output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
