name: Build & push images to GHCR

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "scripts/**"
      - "data/fixtures/professional/**"
      - "data/seed/**"
      - "infra/docker/**"
      - ".github/workflows/docker-ghcr.yml"

  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - name: nhipquan-api
            dockerfile: infra/docker/Dockerfile.api

          - name: nhipquan-web
            dockerfile: infra/docker/Dockerfile.web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Web build arg — API URL public
        if: matrix.name == 'nhipquan-web'
        run: echo "WEB_API_URL=https://nhipquan.duckdns.org" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # EC2 t3.small là x86_64 — chỉ build amd64. Bỏ arm64/QEMU: build
          # nhanh hơn nhiều và hết fail thất thường do Google Fonts rate-limit
          # ở builder QEMU (đã xảy ra 10:17Z 06-09).
          platforms: linux/amd64
          push: true
          build-args: |
            ${{ matrix.name == 'nhipquan-web' && format('NEXT_PUBLIC_API_URL={0}', env.WEB_API_URL) || '' }}
          tags: |
            ghcr.io/kantrun/crew-operations/${{ matrix.name }}:latest
            ghcr.io/kantrun/crew-operations/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
