name: Build & push images to GHCR

# Build 2 image (api + web) mỗi push main; VM Oracle pull về chạy.
# Không build trên VM A1 (chậm, hao quota) — CI build sẵn.

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "infra/docker/**"

env:
  REGISTRY: ghcr.io

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: nhipquan-api
            dockerfile: infra/docker/Dockerfile.api
          - name: nhipquan-web
            dockerfile: infra/docker/Dockerfile.web
    steps:
      - uses: actions/checkout@v4

      - name: Web build arg — API URL public
        if: matrix.name == 'nhipquan-web'
        run: echo "WEB_API_URL=${{ vars.PUBLIC_API_URL || 'https://nhipquan.duckdns.org' }}" >> $GITHUB_ENV

        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build & push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          build-args: |
            ${{ matrix.name == 'nhipquan-web' && format('NEXT_PUBLIC_API_URL={0}', env.WEB_API_URL) || '' }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/crew-operations/${{ matrix.name }}:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/crew-operations/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
