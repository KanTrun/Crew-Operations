name: Build & push images to GHCR

on:
  workflow_run:
    workflows: ["ci"]
    branches: [main]
    types: [completed]

  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  build-push:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - name: nhipquan-api
            dockerfile: infra/docker/Dockerfile.api

          - name: nhipquan-web
            dockerfile: infra/docker/Dockerfile.web

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.IMAGE_SHA }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        # URL API public cho build web (NEXT_PUBLIC_API_URL). Khai báo `env` ở
        # CẤP STEP — nơi thực sự dùng — để biểu thức `env.WEB_API_URL` bên dưới
        # chắc chắn hợp lệ. Khai ở cấp workflow KHÔNG đủ: extension GitHub
        # Actions chỉ validate `env` theo job/step nên vẫn cảnh báo
        # "Context access might be invalid: WEB_API_URL" (false positive).
        # Trước đây giá trị này còn bị echo động vào $GITHUB_ENV lúc chạy — khó
        # kiểm, nay cố định trong workflow.
        env:
          WEB_API_URL: https://nhipquan.duckdns.org
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # EC2 t3.small là x86_64 — chỉ build amd64. Bỏ arm64/QEMU: build
          # nhanh hơn nhiều và hết fail thất thường do Google Fonts rate-limit
          # ở builder QEMU (đã xảy ra 10:17Z 06-09).
          platforms: linux/amd64
          push: true
          build-args: |
            ${{ matrix.name == 'nhipquan-web' && format('NEXT_PUBLIC_API_URL={0}', env.WEB_API_URL) || '' }}
          tags: |
            ghcr.io/kantrun/crew-operations/${{ matrix.name }}:latest
            ghcr.io/kantrun/crew-operations/${{ matrix.name }}:${{ env.IMAGE_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
