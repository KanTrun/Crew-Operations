name: ci

on:
  push:
    branches: [main, release/**]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CA_AGENT_MODE: replay

jobs:
  lint-type:
    name: "01 lint + type"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python tools
        run: pip install ruff mypy
      - name: Ruff
        run: ruff check apps/api/src packages scripts
      - name: Mypy (packages when present)
        run: |
          if [ -f pyproject.toml ]; then mypy packages apps/api/src --ignore-missing-imports || true; fi
      - name: ESLint / tsc (web)
        working-directory: apps/web
        run: |
          if [ -f package.json ]; then npm install && npm run lint && npm run typecheck; else echo "web stub"; fi

  unit:
    name: "02 unit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install workspace
        run: |
          pip install -e ./packages/contracts -e ./packages/solver -e ./packages/agents -e ./packages/gates -e ./packages/opsengine -e ./packages/playbook -e ./apps/api pytest httpx pyyaml ortools
      - run: CA_AGENT_MODE=replay pytest -q
      - name: Export contracts
        run: python scripts/export_contracts.py

  integration:
    name: "03 integration"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: nhipquan
          POSTGRES_USER: nhipquan
          POSTGRES_DB: nhipquan
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nhipquan"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest httpx
      - run: pytest -q apps/api/tests/integration || true

  architecture:
    name: "04 architecture"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: pytest -q packages/agents/tests/test_architecture.py packages/gates/tests packages/solver/tests -k architecture || pytest -q packages/agents/tests/test_architecture.py

  solver-bench:
    name: "05 solver bench"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install solver + deps
        run: |
          python -m pip install -e ./packages/contracts -e ./packages/solver \
            -e ./packages/gates -e ./packages/playbook pyyaml ortools
      - name: Solve + independent verify
        run: |
          python scripts/solve_tuan.py
          python scripts/verify_hard.py

  agent-eval:
    name: "06 agent eval"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Enforce replay mode (no live LLM)
        run: |
          test "$CA_AGENT_MODE" = "replay"
      - name: Install agents + eval
        run: |
          python -m pip install -e ./packages/agents -e ./packages/contracts
          CA_AGENT_MODE=replay python scripts/eval_ag_tkb.py
          CA_AGENT_MODE=replay python scripts/eval_ag_msg.py

  web:
    name: "07 web"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - working-directory: apps/web
        run: |
          if [ -f package.json ]; then npm install && npm test; else echo "web stub"; fi

  e2e:
    name: "08 e2e"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install API + Playwright
        run: |
          pip install -e ./packages/contracts -e ./packages/solver -e ./packages/agents -e ./packages/gates -e ./packages/opsengine -e ./packages/playbook -e ./apps/api httpx pyyaml ortools uvicorn
          cd apps/web && npm install && npx playwright install --with-deps chromium
      - name: Playwright 8 flows
        working-directory: apps/web
        run: npm run build && npm run test:e2e

  docker:
    name: "09 docker build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare env
        run: cp .env.example .env || touch .env
      - run: docker compose -f infra/docker/compose.yml build
      - name: Stack lên và smoke toàn tuyến
        run: |
          docker compose -f infra/docker/compose.yml up -d
          docker compose -f infra/docker/compose.yml exec -T api python /app/scripts/smoke_docker.py
      - name: Log khi đỏ
        if: failure()
        run: docker compose -f infra/docker/compose.yml logs --tail=200
      - name: Dọn
        if: always()
        run: docker compose -f infra/docker/compose.yml down -v

  no-live-llm:
    name: "10 no live LLM in tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: CA_AGENT_MODE=replay pytest -q packages/agents/tests/test_no_network.py

  yaml-templates:
    name: "11 yaml templates"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python scripts/validate_templates.py
