name: ci

on:
  push:
    branches: [main, release/**]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CA_AGENT_MODE: replay

jobs:
  lint-type:
    name: "01 lint + type"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python tools
        run: pip install ruff mypy
      - name: Ruff
        run: ruff check apps packages || true
      - name: Mypy (packages when present)
        run: |
          if [ -f pyproject.toml ]; then mypy packages apps/api/src --ignore-missing-imports || true; fi
      - name: ESLint / tsc (web)
        working-directory: apps/web
        run: |
          if [ -f package.json ]; then npm ci && npm run lint && npm run typecheck; else echo "web stub"; fi

  unit:
    name: "02 unit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: pytest -q apps packages || true

  integration:
    name: "03 integration"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: nhipquan
          POSTGRES_USER: nhipquan
          POSTGRES_DB: nhipquan
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nhipquan"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest httpx
      - run: pytest -q apps/api/tests/integration || true

  architecture:
    name: "04 architecture"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: pytest -q packages/agents/tests/test_architecture.py packages/gates/tests packages/solver/tests -k architecture || pytest -q packages/agents/tests/test_architecture.py

  solver-bench:
    name: "05 solver bench"
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'solver') || contains(github.event.head_commit.message, 'solver') || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - run: echo "bench stub — activate when packages/solver has benchmarks"

  agent-eval:
    name: "06 agent eval"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce replay mode (no live LLM)
        run: |
          test "$CA_AGENT_MODE" = "replay"
          echo "eval stub — make eval when golden sets land"

  web:
    name: "07 web"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - working-directory: apps/web
        run: |
          if [ -f package.json ]; then npm ci && npm test; else echo "web stub"; fi

  e2e:
    name: "08 e2e"
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')
    steps:
      - uses: actions/checkout@v4
      - run: echo "playwright stub — enable on main/release when flows exist"

  docker:
    name: "09 docker build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f infra/docker/compose.yml build

  no-live-llm:
    name: "10 no live LLM in tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: CA_AGENT_MODE=replay pytest -q packages/agents/tests/test_no_network.py

  yaml-templates:
    name: "11 yaml templates"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python scripts/validate_templates.py
