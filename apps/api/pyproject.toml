[project]
name = "ca-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "psycopg[binary]>=3.2.0",
  "redis>=5.0.0",
  "pyyaml>=6.0",
  "sqlalchemy>=2.0.0",
  "alembic>=1.13.0",
  "ca-contracts",
]

[tool.uv.sources]
ca-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ca_api"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""
