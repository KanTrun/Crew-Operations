[project]
name = "ca-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "psycopg[binary]>=3.2.0",
  "redis>=5.0.0",
  "pyyaml>=6.0",
  "sqlalchemy>=2.0.0",
  "alembic>=1.13.0",
  "openpyxl>=3.1.5",
  "reportlab>=4.2.5",
  "ca-contracts",
  "cryptography>=42.0.0",
  "google-auth>=2.25.0",
  "google-auth-oauthlib>=1.1.0",
  "google-auth-httplib2>=0.1.1",
  "google-api-python-client>=2.100.0",
]

[tool.uv.sources]
ca-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ca_api"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""
